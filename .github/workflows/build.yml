name: build
# Gera os instaladores (Windows .exe com loopMIDI embutido; macOS .dmg arm64 e intel) e publica na Release
# quando uma tag v* e enviada. Tambem pode ser disparado a mao (workflow_dispatch).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
          pip install pywin32 pyinstaller
      - name: Instalador
        shell: pwsh
        run: .\build\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/PrompterSetup-*.exe

  mac:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'macos-15-intel' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.os }}" = "macos-15-intel" ]; then
            # Intel: torch para em 2.2 (precisa numpy<2) e o sphn (dep. do demucs) nao compila -> stub, o Prompter passa tensores
            grep -v '^demucs' requirements.txt > /tmp/req.txt
            pip install -r /tmp/req.txt "numpy<2" "torch>=2.2,<2.3"
            pip install --no-deps demucs && pip install einops julius lameenc pyyaml safetensors tqdm
            python -c "import site,os;open(os.path.join(site.getsitepackages()[0],'sphn.py'),'w').write('def read(*a, **k): raise RuntimeError(chr(39)+chr(39))')"
          else
            pip install -r requirements.txt
          fi
          pip install pyinstaller pyobjc-framework-Cocoa
      - name: Ícone .icns
        run: |
          mkdir -p build/work/icon.iconset
          for n in 16 32 64 128 256 512; do sips -z $n $n static/prompter.png --out build/work/icon.iconset/icon_${n}x${n}.png >/dev/null; done
          iconutil -c icns build/work/icon.iconset -o static/prompter.icns || true
      - name: DMG
        run: bash build/mac/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.os }}
          path: dist/Prompter-*.dmg

  release:
    needs: [windows, mac]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      # um asset por passo (sequencial): subir os tres em paralelo dava erro 5xx "Unicorn" no maior
      - name: Release (gh, com novas tentativas por arquivo)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES="**Prompter ${TAG#v}** · teleprompter sincronizado com o Pro Tools, por [Marllon Machado](https://github.com/krocksss)

          - **Windows**: PrompterSetup-${TAG#v}.exe (inclui o loopMIDI). Baixar, executar, Instalar.
          - **macOS**: Prompter-${TAG#v}-mac-arm64.dmg (Apple Silicon) ou -x86_64.dmg (Intel). Arraste para Aplicativos; na 1ª vez botão direito > Abrir.

          Problemas? https://www.instagram.com/marllon_sec/"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" --title "Prompter ${TAG#v}" --notes "$NOTES" --repo "$GITHUB_REPOSITORY"
          for f in out/*; do
            ok=0; for i in 1 2 3 4 5; do gh release upload "$TAG" "$f" --clobber --repo "$GITHUB_REPOSITORY" && { ok=1; break; } || { echo "tentativa $i falhou: $f"; sleep 40; }; done
            [ "$ok" = 1 ] || echo "FALHOU DE VEZ: $f"
          done
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
