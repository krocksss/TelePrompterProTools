<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Prompter · músicas</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/static/prompter.png">
<style>
  :root {
    --bg:#0f1113; --panel:#15181b; --panel-2:#1b1f23; --line:#262b30; --line-2:#323940;
    --fg:#e9ecef; --muted:#8e969e; --faint:#5c646c;
    --accent:#3ecf8e; --accent-ink:#06261a; --accent-dim:#1c3a2c; --warn:#e8b84a; --bad:#e5645f;
    --r:10px; --ease:cubic-bezier(.16,1,.3,1);
    --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:var(--font); font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased; }
  a { color:var(--fg); text-decoration:none; }
  button { font:inherit; color:var(--fg); background:var(--panel-2); border:1px solid var(--line-2); border-radius:var(--r); padding:9px 14px; cursor:pointer; white-space:nowrap; transition:background .15s, border-color .15s, transform .08s; }
  button:hover { background:#22272c; border-color:#3c444c; }
  button:active { transform:translateY(1px); }
  button:disabled { opacity:.45; cursor:default; transform:none; }
  button.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600; }
  button.primary:hover { background:#4ddc9c; border-color:#4ddc9c; }
  button.quiet { background:transparent; border-color:transparent; color:var(--muted); }
  button.quiet:hover { background:var(--panel-2); color:var(--fg); border-color:var(--line-2); }
  button.on { background:var(--accent-dim); border-color:#2c6b4c; color:var(--accent); }
  button.danger { color:var(--bad); }
  input, select, textarea { font:inherit; color:var(--fg); background:#0c0e10; border:1px solid var(--line-2); border-radius:var(--r); padding:8px 10px; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(62,207,142,.15); }
  kbd { font:12px/1 var(--font); background:var(--panel-2); border:1px solid var(--line-2); border-radius:6px; padding:2px 6px; color:var(--muted); }

  header { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:18px; height:60px; padding:0 22px; background:rgba(15,17,19,.92); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
  header .brand { display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:-.01em; }
  header .brand img { width:24px; height:24px; border-radius:6px; }
  header nav { display:flex; gap:4px; }
  header nav a { padding:7px 12px; border-radius:var(--r); color:var(--muted); }
  header nav a:hover { background:var(--panel-2); color:var(--fg); }
  header nav a.cur { color:var(--fg); background:var(--panel-2); }
  #status { margin-left:auto; display:flex; gap:10px; align-items:center; font-size:13px; color:var(--muted); }
  .pill { display:inline-flex; align-items:center; gap:7px; padding:5px 11px; border-radius:999px; background:var(--panel); border:1px solid var(--line); color:var(--muted); white-space:nowrap; }
  .pill.ok { color:var(--fg); border-color:#2c6b4c; }
  .pill .led { width:7px; height:7px; border-radius:50%; background:var(--faint); }
  .pill.ok .led { background:var(--accent); box-shadow:0 0 8px rgba(62,207,142,.6); }
  .pill.warn .led { background:var(--warn); }
  #tcPill { font-variant-numeric:tabular-nums; }
  header .credit { display:flex; align-items:center; gap:7px; color:var(--faint); font-size:12px; }
  header .credit img { width:20px; height:20px; border-radius:50%; }

  main { display:grid; grid-template-columns:300px 1fr; min-height:calc(100dvh - 60px - 80px); }
  aside { border-right:1px solid var(--line); padding:18px 16px; display:flex; flex-direction:column; gap:14px; }
  section#editor { padding:22px 28px 60px; min-width:0; }
  @media (max-width:900px) { main { grid-template-columns:1fr; } aside { border-right:0; border-bottom:1px solid var(--line); } section#editor { padding:18px 16px 60px; } header nav { display:none; } }

  #drop { border:1.5px dashed var(--line-2); border-radius:var(--r); padding:16px 14px; cursor:pointer; color:var(--muted); transition:border-color .2s, background .2s; }
  #drop b { display:block; color:var(--fg); font-size:15px; margin-bottom:2px; }
  #drop:hover, body.dragging #drop { border-color:var(--accent); background:var(--accent-dim); color:var(--fg); }
  #upBar { height:4px; background:var(--line); border-radius:2px; margin-top:10px; overflow:hidden; display:none; }
  #upBar i { display:block; height:100%; width:0; background:var(--accent); transition:width .2s; }
  body.dragging::after { content:"Solte a música aqui"; position:fixed; inset:0; display:flex; align-items:center; justify-content:center; font-size:38px; font-weight:700; letter-spacing:-.02em; color:var(--accent); background:rgba(15,17,19,.8); z-index:50; pointer-events:none; }

  .songs { display:flex; flex-direction:column; gap:2px; }
  .songs .lbl { font-size:12px; color:var(--faint); margin:6px 4px 4px; }
  .songs .it { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:var(--r); cursor:pointer; transition:background .15s; }
  .songs .it:hover { background:var(--panel-2); }
  .songs .it.sel { background:var(--panel-2); box-shadow:inset 3px 0 0 var(--accent); }
  .songs .it .n { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .songs .it.live .n::before { content:"▶ "; color:var(--accent); font-size:11px; }
  .st { font-size:11px; padding:3px 8px; border-radius:999px; background:var(--panel-2); color:var(--muted); white-space:nowrap; }
  .st.pronto, .st.alinhado, .st.manual { color:var(--accent); background:var(--accent-dim); }
  .st.transcrevendo, .st.pendente { color:var(--warn); background:#3a3020; }
  .st.erro, .st.sem-voz { color:var(--bad); background:#3a2422; }
  .pastas .ph { display:flex; align-items:center; gap:8px; padding:9px 12px; border-radius:var(--r); cursor:pointer; }
  .pastas .ph:hover { background:var(--panel-2); }
  .pastas .ph.open { background:var(--panel-2); }
  .pastas .ph .n { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
  .pastas .ph .n::before { content:"▸ "; color:var(--faint); font-weight:400; }
  .pastas .ph.open .n::before { content:"▾ "; }
  .pastas .ph .cnt { font-size:11px; color:var(--faint); }
  .pastas .ph .pt { font-size:11px; padding:3px 8px; border-radius:999px; background:var(--accent-dim); color:var(--accent); white-space:nowrap; }
  .pastas .pi { display:flex; align-items:center; gap:6px; padding:6px 8px 6px 26px; border-radius:var(--r); cursor:pointer; font-size:14px; }
  .pastas .pi:hover { background:var(--panel-2); }
  .pastas .pi.sel { background:var(--panel-2); box-shadow:inset 3px 0 0 var(--accent); }
  .pastas .pi .n { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pastas .pi .n::before { content:attr(data-i) ". "; color:var(--faint); }
  .pastas .pi.live .n { color:var(--accent); }
  .pastas .pi .ib, .songs .it .ib { font-size:12px; padding:2px 6px; border-radius:6px; background:transparent; border:1px solid transparent; color:var(--faint); }
  .pastas .pi:hover .ib, .songs .it:hover .ib { color:var(--muted); border-color:var(--line-2); }
  .pastas .pi .ib:hover, .songs .it .ib:hover { color:var(--fg); background:var(--panel); }
  .pastas .pact { display:flex; gap:6px; padding:4px 8px 8px 26px; flex-wrap:wrap; }
  .pastas .pact button { padding:5px 10px; font-size:12px; }
  .pastas .pempty { padding:2px 8px 8px 26px; font-size:12px; color:var(--faint); }
  .pastas .newp { display:flex; gap:6px; padding:4px 4px 0; }
  .pastas .newp input { flex:1; min-width:0; padding:6px 9px; font-size:13px; }
  .pastas .newp button { padding:6px 10px; font-size:13px; }

  #empty { max-width:720px; margin:6vh auto 0; animation:rise .5s var(--ease); }
  #empty h1 { font-size:34px; letter-spacing:-.02em; line-height:1.1; margin:0 0 8px; }
  #empty p { color:var(--muted); margin:0 0 26px; max-width:52ch; }
  #bigDrop { border:1.5px dashed var(--line-2); border-radius:14px; padding:46px 24px; text-align:center; cursor:pointer; transition:border-color .2s, background .2s; }
  #bigDrop:hover, body.dragging #bigDrop { border-color:var(--accent); background:var(--accent-dim); }
  #bigDrop .big { font-size:22px; font-weight:600; margin-bottom:6px; }
  #bigDrop .sm { color:var(--muted); }
  .steps { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:26px; }
  .steps div { padding:14px 16px; border-top:2px solid var(--line-2); }
  .steps b { display:block; margin-bottom:4px; }
  .steps span { color:var(--muted); font-size:14px; }
  @media (max-width:700px) { .steps { grid-template-columns:1fr; } }

  .head { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  #edName { font-size:22px; font-weight:700; letter-spacing:-.01em; background:transparent; border-color:transparent; padding:6px 8px; flex:1; min-width:220px; }
  #edName:hover { border-color:var(--line-2); } #edName:focus { background:#0c0e10; }
  .saved { color:var(--accent); font-size:13px; opacity:0; transition:opacity .3s; } .saved.show { opacity:1; }

  #guide { margin-top:16px; display:grid; grid-template-columns:auto 1fr auto; gap:16px; align-items:center; padding:16px 18px; border-radius:var(--r); background:var(--panel); border:1px solid var(--line); animation:rise .4s var(--ease); }
  #guide .n { width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; background:var(--panel-2); color:var(--muted); }
  #guide.ok .n { background:var(--accent); color:var(--accent-ink); }
  #guide.busy .n { background:#3a3020; color:var(--warn); }
  #guide.bad .n { background:#3a2422; color:var(--bad); }
  #guide h3 { margin:0 0 2px; font-size:16px; }
  #guide p { margin:0; color:var(--muted); font-size:14px; }
  #guide .bar { height:5px; background:var(--line); border-radius:3px; margin-top:10px; overflow:hidden; }
  #guide .bar i { display:block; height:100%; width:0; background:var(--warn); transition:width .5s var(--ease); }
  #guide .bar.indet i { width:35%; animation:slide 1.4s ease-in-out infinite; }
  @keyframes slide { 0% { transform:translateX(-100%); } 100% { transform:translateX(300%); } }
  @keyframes rise { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  @media (max-width:700px) { #guide { grid-template-columns:auto 1fr; } #guide > :last-child { grid-column:1 / -1; } }

  #transport { display:flex; align-items:center; gap:14px; margin-top:16px; flex-wrap:wrap; }
  #bPlay { width:62px; height:62px; border-radius:50%; font-size:22px; display:flex; align-items:center; justify-content:center; background:var(--accent); color:var(--accent-ink); border-color:var(--accent); padding:0; }
  #bPlay:hover { background:#4ddc9c; }
  #bPlay.stop { background:var(--panel-2); color:var(--fg); border-color:var(--line-2); }
  .time { font-variant-numeric:tabular-nums; font-size:26px; font-weight:600; letter-spacing:-.01em; min-width:200px; }
  .time small { color:var(--faint); font-size:14px; font-weight:400; }
  #tSrc { color:var(--muted); font-size:13px; }
  #wave { width:100%; height:96px; display:block; margin-top:14px; border-radius:var(--r); background:#0c0e10; cursor:crosshair; border:1px solid var(--line); }
  #waveMsg { font-size:12px; color:var(--faint); margin-top:4px; }

  .lines { display:flex; flex-direction:column; gap:3px; margin-top:18px; }
  .row { display:grid; grid-template-columns:28px 88px 1fr auto; gap:8px; align-items:center; padding:3px 6px; border-radius:var(--r); transition:background .2s; }
  .row .i { color:var(--faint); font-size:12px; text-align:right; font-variant-numeric:tabular-nums; }
  .row input.t { width:100%; padding:7px 6px; font-variant-numeric:tabular-nums; font-size:13px; color:var(--muted); }
  .row input.x { width:100%; padding:8px 12px; font-size:16px; }
  .row.cur { background:var(--accent-dim); } .row.cur input.x { border-color:var(--accent); color:var(--fg); }
  .row.past input.x { color:var(--muted); }
  .row .ops { display:flex; gap:2px; opacity:0; transition:opacity .15s; } .row:hover .ops, .row.cur .ops, .row:focus-within .ops { opacity:1; }
  .row .ops button { padding:5px 9px; font-size:13px; }
  .words { grid-column:2 / 5; display:flex; flex-wrap:wrap; gap:4px; padding:0 0 6px 0; }
  .words span { font-size:12px; padding:2px 8px; border-radius:999px; background:var(--panel-2); color:var(--muted); cursor:pointer; transition:background .2s, color .2s; }
  .words span.sung { color:var(--accent-ink); background:var(--accent); }
  .words span:hover { color:var(--fg); }

  details.more { margin-top:22px; border-top:1px solid var(--line); padding-top:12px; }
  details.more summary { cursor:pointer; color:var(--muted); list-style:none; display:flex; align-items:center; gap:8px; }
  details.more summary::-webkit-details-marker { display:none; }
  details.more summary::before { content:"›"; display:inline-block; transition:transform .2s; font-size:18px; color:var(--faint); }
  details.more[open] summary::before { transform:rotate(90deg); }
  .toolbar { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; align-items:center; }
  .hint { color:var(--muted); font-size:13px; }
  .box { margin-top:12px; padding:14px; border-radius:var(--r); background:var(--panel); border:1px solid var(--line); }
  textarea { width:100%; min-height:200px; }
  footer.contact { margin-top:40px; padding:18px 22px 26px; border-top:1px solid var(--line); color:var(--faint); font-size:13px; text-align:center; }
  footer.contact a { color:var(--muted); text-decoration:underline; text-underline-offset:3px; }
  footer.contact a:hover { color:var(--fg); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<header>
  <a class="brand" href="/estudio"><img src="/static/prompter.png" alt="">Prompter</a>
  <nav>
    <a class="cur" href="/estudio">Músicas</a>
    <a href="/" target="_blank">Teleprompter</a>
    <a href="/config">Configuração</a>
  </nav>
  <div id="status"></div>
  <a class="credit" href="https://github.com/krocksss" target="_blank" title="feito por Marllon Machado"><img src="/static/autor.png" alt="">krocksss</a>
</header>
<main>
  <aside>
    <div id="drop" onclick="$('fileIn').click()"><b>Adicionar música</b>Arraste o MP3 ou WAV aqui, ou clique para escolher no computador.<div id="upBar"><i></i></div></div>
    <input type="file" id="fileIn" accept="audio/*,.mp3,.wav,.m4a,.flac,.aif,.aiff,.ogg" multiple style="display:none">
    <div class="songs pastas" id="pastas"></div>
    <div class="songs" id="songs"></div>
    <button class="quiet" onclick="control({action:'rescan'}).then(loadSongs)" title="reler a pasta de músicas e a sessão aberta">Reler pasta</button>
  </aside>
  <section id="editor"></section>
</main>
<footer class="contact">Possui problemas? Gostaria de relatar algum erro? Entre em contato: <a href="https://www.instagram.com/marllon_sec/" target="_blank">instagram.com/marllon_sec</a></footer>
<script>
const $ = id => document.getElementById(id);
let songs = {}, cfg = {}, sel = null, view = null, song = null;
let pastas = {}, curPasta = null;   // pastas (setlists); curPasta = pasta aberta na lista
let rows = [];
let audio = new Audio(); audio.preload = 'auto';
let peaks = null, peaksFor = null, duration = 0;
let ptMode = true, hearHere = false;
let base = 0, baseAt = 0, playing = false;
let saveTimer = null, dirtyRows = false;
let curRow = -2, focused = -1;

function control(body) { return fetch('/api/control', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)}); }
function transport(body) { return fetch('/api/transport', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(Object.assign({song_id: sel, pasta: pastaOf(sel)}, body))}); }
function pastaApi(body) { return fetch('/api/pasta', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)}).then(r => r.json()).then(j => { if (j.pastas) { pastas = j.pastas; renderPastas(); loadSongs(); } return j; }); }
function pastaOf(sid) { if (!sid) return null; if (curPasta && pastas[curPasta] && pastas[curPasta].songs.includes(sid)) return curPasta; if (view && view.pasta_id && pastas[view.pasta_id] && pastas[view.pasta_id].songs.includes(sid)) return view.pasta_id; const ids = Object.keys(pastas).filter(id => pastas[id].songs.includes(sid)); return ids.length === 1 ? ids[0] : null; }
function pastaLoaded(pid, sid) { return !!(view && view.pasta_id === pid && (view.loaded || []).includes(sid)); }
function esc(s) { return (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmt(t) { t = Math.max(0, t||0); const m = Math.floor(t/60), s = Math.floor(t%60), ms = Math.round((t - Math.floor(t))*1000); return m + ':' + String(s).padStart(2,'0') + '.' + String(ms).padStart(3,'0'); }
function parseT(v) { v = String(v).trim(); const m = v.match(/^(\d+):(\d+(?:[.,]\d+)?)$/); if (m) return +m[1]*60 + parseFloat(m[2].replace(',','.')); const f = parseFloat(v.replace(',','.')); return isNaN(f) ? 0 : f; }
function norm(s) { return (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim(); }
function isPT() { return ptMode && view && view.ptsl; }
function sessionMatches() { if (!song || !view || !view.session) return false; if (view.loaded && view.loaded.length) return view.loaded.includes(sel); if (view.pasta_id) return false; if (!((view.session_audio_n || 0) > 0)) return false; return norm(view.session) === norm(song.name) || (song.session_alias && norm(song.session_alias) === norm(view.session)); }

async function loadSongs() {
  const r = await fetch('/api/songs'); const j = await r.json();
  songs = j.songs; cfg = j.config; if (j.pastas) pastas = j.pastas;
  const ids = Object.keys(songs).sort((a,b) => songs[a].name.localeCompare(songs[b].name));
  const cp = curPasta && pastas[curPasta] ? pastas[curPasta] : null;
  $('songs').innerHTML = ids.length ? '<div class="lbl">' + (cp ? 'Suas músicas · clique em + para pôr na pasta "' + esc(cp.name) + '"' : 'Suas músicas') + '</div>' + ids.map(id => `<div class="it ${id===sel?'sel':''} ${view && view.song_id===id ? 'live':''}" onclick="select('${id}')">
      <span class="n">${esc(songs[id].name)}</span>${cp && !cp.songs.includes(id) ? `<button class="ib" onclick="event.stopPropagation();pastaApi({action:'add',pasta_id:'${curPasta}',song_id:'${id}'})" title="pôr na pasta">+</button>` : ''}<span class="st ${songs[id].status}">${statusLabel(songs[id].status)}</span></div>`).join('') : '';
  renderPastas();
  if (sel && !songs[sel]) { sel = null; song = null; }
  if (!sel) renderEmpty();
}
function renderPastas() {
  const el = $('pastas'); if (!el) return;
  const ids = Object.keys(pastas).sort((a,b) => pastas[a].name.localeCompare(pastas[b].name));
  let h = '<div class="lbl">Pastas (setlists): uma sessão no Pro Tools com todas as músicas, trocar é instantâneo</div>';
  for (const id of ids) {
    const p = pastas[id], open = id === curPasta, live = view && view.pasta_id === id;
    h += `<div class="ph ${open?'open':''}" onclick="togglePasta('${id}')"><span class="n">${esc(p.name)}</span><span class="cnt">${p.songs.length}</span>${live ? '<span class="pt">no Pro Tools</span>' : ''}</div>`;
    if (!open) continue;
    if (!p.songs.length) h += '<div class="pempty">Vazia. Clique no + de uma música abaixo para colocar aqui.</div>';
    p.songs.forEach((sid, i) => { const sg = songs[sid]; if (!sg) return;
      const ld = pastaLoaded(id, sid);
      h += `<div class="pi ${sid===sel?'sel':''} ${view && view.song_id===sid && live ? 'live':''}" onclick="select('${sid}')" title="${ld ? 'na linha do tempo do Pro Tools' : 'ainda não está no Pro Tools: o play coloca'}">
        <span class="n" data-i="${i+1}">${esc(sg.name)}</span><span class="st ${sg.status}">${statusLabel(sg.status)}</span>
        <button class="ib" onclick="event.stopPropagation();pastaApi({action:'move',pasta_id:'${id}',song_id:'${sid}',dir:-1})" title="subir">↑</button>
        <button class="ib" onclick="event.stopPropagation();pastaApi({action:'move',pasta_id:'${id}',song_id:'${sid}',dir:1})" title="descer">↓</button>
        <button class="ib" onclick="event.stopPropagation();pastaApi({action:'remove',pasta_id:'${id}',song_id:'${sid}'})" title="tirar da pasta">✕</button></div>`; });
    const missing = p.songs.filter(sid => !pastaLoaded(id, sid)).length;
    const busy = view && view.pasta_progresso && view.pasta_progresso.pasta === p.name;
    h += `<div class="pact">` +
      (p.songs.length ? `<button class="${live && !missing ? 'on' : 'primary'}" ${busy || !(view && view.ptsl) ? 'disabled' : ''} onclick="event.stopPropagation();pastaApi({action:'load',pasta_id:'${id}'})" title="${view && view.ptsl ? '' : 'abra o Pro Tools primeiro'}">${busy ? 'Carregando…' : (live && !missing ? 'No Pro Tools ✓' : (live ? 'Colocar as que faltam' : 'Carregar no Pro Tools'))}</button>` : '') +

  const t = songTime();
  if (peaks && peaksFor === sel) {
    const N = peaks.length; for (let i = 0; i < N; i++) { const x = i / N * W; const h = Math.max(1, peaks[i] * 84); const tt = i / N * dur; g.fillStyle = tt <= t ? '#3ecf8e' : '#2a4a3b'; g.fillRect(x, 48 - h/2, Math.max(1, W/N - 0.3), h); }
  } else { g.fillStyle = '#23272b'; g.fillRect(0, 47, W, 2); }
  rows.forEach((l, i) => { const x = l.t / dur * W; g.fillStyle = i === curRow ? '#e8b84a' : 'rgba(233,236,239,.35)'; g.fillRect(x, 4, 1, 88); g.font = '10px system-ui'; g.fillText(String(i+1), x + 3, 12); });
  const x = Math.min(W, t / dur * W); g.fillStyle = '#fff'; g.fillRect(x - 1, 0, 2, 96);
}
window.addEventListener('resize', drawWave);
document.addEventListener('click', e => { if (e.target.id === 'wave') { const r = e.target.getBoundingClientRect(); const dur = duration || (rows.length ? rows[rows.length-1].t + 5 : 240); seekTo((e.clientX - r.left) / r.width * dur); } });

function songTime() { if (isPT()) return playing ? base + (performance.now() - baseAt) / 1000 : base; return audio.currentTime; }
function isPlaying() { return isPT() ? playing : !audio.paused; }
let preparing = false;
async function togglePlay() {
  if (preparing) return;
  if (isPT()) {
    if (playing) { await transport({action:'stop'}); }
    else {
      const pp = pastaOf(sel);
      const needs = pp ? !pastaLoaded(pp, sel) : !(sessionMatches() && (view.session_audio_n || 0) > 0);
      if (needs) { preparing = true; const g = $('guide'); if (g) { g.className = 'busy'; g.innerHTML = '<div class="n">2</div><div><h3>' + (pp ? 'Carregando a pasta "' + esc(pastas[pp].name) + '" no Pro Tools' : 'Carregando a música no Pro Tools') + '</h3><p>' + (pp ? 'Abrindo a sessão da pasta e colocando as músicas na linha do tempo. Só na primeira vez; depois trocar é na hora.' : 'Convertendo o áudio e preparando a sessão. O play começa em seguida.') + '</p><div class="bar indet"><i></i></div></div><div></div>'; } }
      try {
        const r = await transport({action:'play', seconds: songTime(), ensure: true});
        const j = await r.json();
        if (!j.ok) { const g = $('guide'); if (g) { g.className = 'bad'; g.innerHTML = '<div class="n">!</div><div><h3>Não deu para preparar o Pro Tools</h3><p>' + esc(j.erro || '') + '</p></div><div><button onclick="togglePlay()">Tentar de novo</button></div>'; } }
        else if (needs) setTimeout(loadSong, 1500);
      } finally { preparing = false; }
    }
  }
  else { if (audio.paused) { try { await audio.play(); } catch (e) {} } else audio.pause(); }
  renderTransport();
}
async function seekTo(t, soft) {
  t = Math.max(0, t);
  if (isPT()) { if (soft && playing) return; base = t; baseAt = performance.now(); await transport({action:'locate', seconds:t}); }
  else audio.currentTime = t;
  drawWave(); markRows(-2);
}
function renderTransport() {
  const b = $('bPlay'); if (!b) return;
  const pl = isPlaying(); b.textContent = pl ? '■' : '▶'; b.className = pl ? 'stop' : ''; b.title = pl ? 'parar (espaço)' : 'tocar (espaço)';
  $('bPT').className = ptMode ? 'on' : ''; $('bPT').disabled = !(view && view.ptsl);
  $('bHear').className = hearHere ? 'on' : ''; $('bHear').style.display = isPT() ? '' : 'none';
  $('tSrc').textContent = isPT() ? (view.session ? (view.source === 'mtc' ? 'Pro Tools, posição por MTC' : 'Pro Tools, posição estimada') : 'o play vai carregar a música no Pro Tools') : 'tocando aqui';
  if (isPT()) { if (hearHere && playing) { if (audio.paused) { audio.currentTime = songTime(); audio.play().catch(()=>{}); } } else if (!audio.paused) audio.pause(); }
}
setInterval(() => { if (isPT() && hearHere && playing && !audio.paused && Math.abs(audio.currentTime - songTime()) > 0.25) audio.currentTime = songTime(); }, 600);
audio.addEventListener('play', renderTransport); audio.addEventListener('pause', renderTransport);
audio.addEventListener('loadedmetadata', () => { if (!duration) { duration = audio.duration; if ($('tDur')) $('tDur').textContent = fmt(duration); } });
function frame() { requestAnimationFrame(frame); if (!song) return; const t = songTime(); const el = $('tNow'); if (el) el.textContent = fmt(t); markRows(); if (isPlaying()) drawWave(); }
requestAnimationFrame(frame);
setInterval(() => { if (song && !isPlaying()) drawWave(); }, 500);

document.addEventListener('keydown', e => {
  const inText = e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA';
  if (e.key === ' ' && (!inText || e.ctrlKey) && song) { e.preventDefault(); togglePlay(); }
  else if (e.altKey && e.key === 'ArrowLeft') { e.preventDefault(); seekTo(songTime() - 2); }
  else if (e.altKey && e.key === 'ArrowRight') { e.preventDefault(); seekTo(songTime() + 2); }
  else if (e.ctrlKey && e.key.toLowerCase() === 's') { e.preventDefault(); save(); }
});

let dragN = 0;
document.addEventListener('dragenter', e => { if ([...e.dataTransfer.types].includes('Files')) { dragN++; document.body.classList.add('dragging'); } });
document.addEventListener('dragleave', e => { dragN = Math.max(0, dragN - 1); if (!dragN) document.body.classList.remove('dragging'); });
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => { e.preventDefault(); dragN = 0; document.body.classList.remove('dragging'); if (e.dataTransfer.files.length) upload(e.dataTransfer.files); });
$('fileIn').addEventListener('change', e => { if (e.target.files.length) upload(e.target.files); e.target.value = ''; });
function upload(files) {
  const fd = new FormData();
  [...files].forEach(f => fd.append('file', f, f.name));
  if (view && view.session) fd.append('session_alias', view.session);
  const bar = $('upBar'); bar.style.display = 'block'; bar.firstElementChild.style.width = '0';
  const x = new XMLHttpRequest(); x.open('POST', '/api/upload');
  x.upload.onprogress = ev => { if (ev.lengthComputable) bar.firstElementChild.style.width = Math.round(ev.loaded / ev.total * 100) + '%'; };
  x.onload = async () => { bar.style.display = 'none'; try { const j = JSON.parse(x.responseText); if (j.ok) { await loadSongs(); await select(j.song_id); } else alert(j.erro || 'falha no envio'); } catch (e) { alert('falha no envio'); } };
  x.onerror = () => { bar.style.display = 'none'; alert('falha no envio'); };
  x.send(fd);
}

function connect() {
  const es = new EventSource('/api/stream');
  es.onmessage = e => {
    const v = JSON.parse(e.data); const prev = view; view = v;
    $('status').innerHTML =
      `<span class="pill ${v.ptsl ? 'ok' : (v.protools ? 'warn' : '')}"><i class="led"></i>${v.ptsl ? 'Pro Tools conectado' : (v.protools ? 'Pro Tools sem conexão' : 'Pro Tools fechado')}</span>` +
      `<span class="pill ${v.session ? 'ok' : ''}"><i class="led"></i>${v.session ? esc(v.session) : 'sem sessão'}</span>` +
      `<span class="pill" id="tcPill">${v.tc} ${v.playing ? '▶' : '■'}</span>`;
    if (sel && v.song_id === sel && v.song_seconds != null) { base = v.song_seconds; baseAt = performance.now(); }
    else if (sel && v.seconds != null && song) { const pp = pastaOf(sel); const lay = pp && pastas[pp].layout && pastas[pp].layout[sel]; base = v.seconds - (lay ? lay.offset : (song.offset || 0)); baseAt = performance.now(); }
    playing = !!v.playing;
    if (!prev || prev.playing !== v.playing || prev.ptsl !== v.ptsl || prev.session !== v.session || prev.source !== v.source || prev.song_id !== v.song_id || prev.session_audio_n !== v.session_audio_n || prev.pasta_id !== v.pasta_id || JSON.stringify(prev.loaded) !== JSON.stringify(v.loaded) || JSON.stringify(prev.pasta_progresso) !== JSON.stringify(v.pasta_progresso)) { renderTransport(); renderGuide(); renderPastas(); }
    if (prev && (prev.pasta_progresso && !v.pasta_progresso)) loadSongs();
    if (sel && v.song_id === sel && v.progresso && songs[sel]) { songs[sel].progresso = v.progresso; renderGuide(); }
    if (sel && v.song_id === sel && prev && prev.status !== v.status && v.status !== 'transcrevendo') loadSong();
    if (prev && prev.song_id !== v.song_id) loadSongs();
  };
  es.onerror = () => { es.close(); setTimeout(connect, 1500); };
}
connect();
loadSongs().then(async () => {
  const q = new URLSearchParams(location.search);
  if (q.get('adicionar')) $('fileIn').click();
  if (q.get('transcrever')) {
    let id = q.get('song'); if (!id) { try { const v = await (await fetch('/api/state')).json(); id = v.song_id; } catch (e) {} }
    if (!id) id = Object.keys(songs)[0];
    if (id && songs[id]) { await select(id); const d = document.querySelector('details.more'); if (d) d.open = true; const b = $('trackBox'); if (b) b.style.display = 'block'; }
  }
});
setInterval(async () => {
  const r = await fetch('/api/songs'); const j = await r.json();
  const a = JSON.stringify(Object.values(j.songs).map(s => [s.status, s.progresso && s.progresso.pct, s.progresso && s.progresso.etapa, s.n_lines]));
  const b = JSON.stringify(Object.values(songs).map(s => [s.status, s.progresso && s.progresso.pct, s.progresso && s.progresso.etapa, s.n_lines]));
  if (a !== b) { const was = songs[sel] && songs[sel].status; songs = j.songs; loadSongs();
    if (sel && j.songs[sel]) { renderGuide(); if ((was === 'transcrevendo' || was === 'pendente') && !['transcrevendo','pendente'].includes(j.songs[sel].status)) loadSong(); } }
}, 2000);
</script>
