name: build
# Gera os instaladores (Windows .exe com loopMIDI embutido; macOS .dmg arm64 e intel) e publica na Release
# quando uma tag v* e enviada. Tambem pode ser disparado a mao (workflow_dispatch).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
          pip install pywin32 pyinstaller
      - name: Instalador
        shell: pwsh
        run: .\build\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/PrompterSetup-*.exe

  mac:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'macos-15-intel' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.os }}" = "macos-15-intel" ]; then
            # Intel: torch para em 2.2 (precisa numpy<2) e o sphn (dep. do demucs) nao compila -> stub, o Prompter passa tensores
            grep -v '^demucs' requirements.txt > /tmp/req.txt
            pip install -r /tmp/req.txt "numpy<2" "torch>=2.2,<2.3"
            pip install --no-deps demucs && pip install einops julius lameenc pyyaml safetensors tqdm
            python -c "import site,os;open(os.path.join(site.getsitepackages()[0],'sphn.py'),'w').write('def read(*a, **k): raise RuntimeError(chr(39)+chr(39))')"
          else
            pip install -r requirements.txt
          fi
          pip install pyinstaller pyobjc-framework-Cocoa
      - name: Ícone .icns
        run: |
          mkdir -p build/work/icon.iconset
          for n in 16 32 64 128 256 512; do sips -z $n $n static/prompter.png --out build/work/icon.iconset/icon_${n}x${n}.png >/dev/null; done
          iconutil -c icns build/work/icon.iconset -o static/prompter.icns || true
      # Assinatura Apple (opcional): so acontece se os segredos MAC_CERT_P12 etc. existirem no repositorio.
      # Sem eles o .dmg sai ad-hoc (botao direito > Abrir), como sempre.
      - name: Certificado Developer ID
        id: cert
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        if: env.MAC_CERT_P12 != ''
        run: |
          echo "$MAC_CERT_P12" | base64 --decode > /tmp/cert.p12
          KC=/tmp/build.keychain-db; KCPW=$(uuidgen)
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import /tmp/cert.p12 -k "$KC" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          ID=$(security find-identity -v -p codesigning "$KC" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)".*/\1/')
          if [ -z "$ID" ]; then echo "nenhuma identidade 'Developer ID Application' no .p12"; exit 1; fi
          echo "identidade: $ID"
          echo "identity=$ID" >> "$GITHUB_OUTPUT"
          rm -f /tmp/cert.p12
      - name: DMG
        env:
          SIGN_IDENTITY: ${{ steps.cert.outputs.identity }}
        run: bash build/mac/build.sh
      - name: Notarização
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        if: steps.cert.outputs.identity != '' && env.ASC_KEY_ID != ''
        run: |
          echo "$ASC_KEY_P8" > /tmp/asc.p8
          DMG=$(ls dist/Prompter-*.dmg | head -1)
          # 1a notarizacao de uma conta demora 1 h+ (analise estendida da Apple); depois cai p/ minutos. Repo publico = minutos gratis.
          xcrun notarytool submit "$DMG" --key /tmp/asc.p8 --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait --timeout 3h | tee /tmp/notary.txt
          grep -q "status: Accepted" /tmp/notary.txt || { ID=$(grep -m1 " id:" /tmp/notary.txt | awk '{print $2}'); xcrun notarytool log "$ID" --key /tmp/asc.p8 --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID"; exit 1; }
          xcrun stapler staple "$DMG"
          spctl -a -t open --context context:primary-signature -v "$DMG" || true
          rm -f /tmp/asc.p8
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.os }}
          path: dist/Prompter-*.dmg

  release:
    needs: [windows, mac]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      # um asset por passo (sequencial): subir os tres em paralelo dava erro 5xx "Unicorn" no maior
      - name: Release (gh, com novas tentativas por arquivo)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES="**Prompter ${TAG#v}** · teleprompter sincronizado com o Pro Tools, por [Marllon Machado](https://github.com/krocksss)

          - **Windows**: PrompterSetup-${TAG#v}.exe (inclui o loopMIDI). Baixar, executar, Instalar.
          - **macOS**: Prompter-${TAG#v}-mac-arm64.dmg (Apple Silicon) ou -x86_64.dmg (Intel). Arraste para Aplicativos e abra (assinado e notarizado pela Apple).

          Problemas? https://www.instagram.com/marllon_sec/"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" --title "Prompter ${TAG#v}" --notes "$NOTES" --repo "$GITHUB_REPOSITORY"
          for f in out/*; do
            ok=0; for i in 1 2 3 4 5; do gh release upload "$TAG" "$f" --clobber --repo "$GITHUB_REPOSITORY" && { ok=1; break; } || { echo "tentativa $i falhou: $f"; sleep 40; }; done
            [ "$ok" = 1 ] || echo "FALHOU DE VEZ: $f"
          done
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
